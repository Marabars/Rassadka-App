<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рассадка офиса · MR Group</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-logo">
      <!-- MR Group geometric mark -->
      <svg class="logo-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#7549E8"/>
        <path d="M7 23V9l5.5 8 5.5-8v14" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 9h3.5c2 0 3.5 1.4 3.5 3.5S25.5 16 23.5 16L27 23" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-wordmark">MR <span>Group</span></span>
    </div>
    <div class="topbar-divider"></div>
    <div class="topbar-title">Рассадка офиса</div>
  </header>

  <nav class="main-nav" id="main-nav">
    <button class="nav-tab active" data-tab="upload">Загрузка файлов</button>
    <button class="nav-tab" data-tab="seating">Рассадка</button>
    <button class="nav-tab" data-tab="layout">Схема офиса</button>
  </nav>

  <main id="app-main" class="app-main"></main>

  <script src="/static/js/constants.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/state.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/calendar.js"></script>
  <script src="/static/js/floor-plan.js"></script>
  <script src="/static/js/drag-drop.js"></script>
  <script src="/static/js/upload.js"></script>
  <script src="/static/js/seating-list.js"></script>
  <script src="/static/js/layout-editor.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
